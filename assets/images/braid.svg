<?xml version="1.0" encoding="UTF-8"?>
<!--
  braid.svg — Cuerda trenzada multicolor para la línea del tiempo.
  Es un patrón vertical que se repite (tileable): mide 40x48 y encaja
  al apilarse verticalmente. Colores: rojo, amarillo, verde, azul.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="40" height="48" viewBox="0 0 40 48">
  <defs>
    <!-- Sombra suave para dar volumen a cada hebra -->
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1"   stop-color="#000000" stop-opacity="0.28"/>
    </linearGradient>
  </defs>

  <!-- Fondo transparente -->
  <rect width="40" height="48" fill="none"/>

  <!-- ===== HEBRAS QUE CRUZAN DE IZQUIERDA A DERECHA (\) ===== -->
  <g stroke-width="13" stroke-linecap="round" fill="none">
    <path d="M4 -6 L36 18"  stroke="#e63946"/>
    <path d="M4 6  L36 30"  stroke="#f4a300"/>
    <path d="M4 18 L36 42"  stroke="#2a9d3f"/>
    <path d="M4 30 L36 54"  stroke="#2670c4"/>
    <path d="M4 42 L36 66"  stroke="#e63946"/>
  </g>

  <!-- ===== HEBRAS QUE CRUZAN DE DERECHA A IZQUIERDA (/) ===== -->
  <g stroke-width="13" stroke-linecap="round" fill="none">
    <path d="M36 -6 L4 18"  stroke="#f4a300"/>
    <path d="M36 6  L4 30"  stroke="#2a9d3f"/>
    <path d="M36 18 L4 42"  stroke="#2670c4"/>
    <path d="M36 30 L4 54"  stroke="#e63946"/>
    <path d="M36 42 L4 66"  stroke="#f4a300"/>
  </g>

  <!-- Brillo/volumen encima de toda la trenza -->
  <rect width="40" height="48" fill="url(#shine)"/>
</svg>
