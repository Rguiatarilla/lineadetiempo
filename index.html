<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Línea del Tiempo: APS y Salud Colectiva</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- Partículas decorativas de fondo -->
    <div class="bg-orb bg-orb--1" aria-hidden="true"></div>
    <div class="bg-orb bg-orb--2" aria-hidden="true"></div>
    <div class="bg-orb bg-orb--3" aria-hidden="true"></div>

    <div class="container">

        <!-- ── Hero / Header ─────────────────────────────────── -->
        <header class="hero">
            <div class="hero__eyebrow">
                <span class="hero__pill hero__pill--aps">APS</span>
                <span class="hero__separator" aria-hidden="true">·</span>
                <span class="hero__pill hero__pill--sc">Salud Colectiva</span>
            </div>
            <h1 class="hero__title">Hitos Históricos<br><em>de la Salud</em></h1>
            <p class="hero__subtitle">
                Evolución de la Atención Primaria en Salud (APS) y la Salud Colectiva
                en América Latina y Colombia
            </p>
            <!-- Decoración línea divisoria -->
            <div class="hero__divider" aria-hidden="true">
                <span class="hero__divider-dot hero__divider-dot--aps"></span>
                <span class="hero__divider-line"></span>
                <span class="hero__divider-dot hero__divider-dot--sc"></span>
            </div>
        </header>

        <!-- ── Filtros ────────────────────────────────────────── -->
        <nav class="controls" aria-label="Filtrar eventos por categoría">
            <button class="btn active" data-filter="all">
                <span class="btn__dot" aria-hidden="true"></span>
                Ver Todos
            </button>
            <button class="btn" data-filter="aps">
                <span class="btn__dot btn__dot--aps" aria-hidden="true"></span>
                Atención Primaria en Salud (APS)
            </button>
            <button class="btn" data-filter="sc">
                <span class="btn__dot btn__dot--sc" aria-hidden="true"></span>
                Salud Colectiva / Medicina Social
            </button>
        </nav>

        <!-- ── Timeline ──────────────────────────────────────── -->
        <main>
            <div class="timeline" id="timeline" role="list" aria-label="Línea del tiempo de hitos históricos"></div>
        </main>

    </div><!-- /container -->

    <!-- Datos del timeline -->
    <script src="js/data.js"></script>
    <!-- Lógica de la aplicación -->
    <script src="js/app.js"></script>
</body>
</html>
